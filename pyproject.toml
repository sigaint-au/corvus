[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretserver"
version = "0.1.0"
description = "Self-hosted team secrets store (Flask + HTMX, Postgres RLS, oat.ink UI)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
    "psycopg[binary]>=3.3.4,<4",
    "psycopg-pool>=3.3,<4",
    "PyJWT==2.13.0",
    "cryptography==50.0.0",
    "gunicorn==26.0.0",
    "ldap3==2.9.1",
    "qrcode==8.2",
    "python-pkcs11==0.9.5",
    "redis>=8,<9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pylint==4.0.7",
    "tox==4.60.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["*"]

[project.urls]
Documentation = "https://github.com/mhahl/secretserver/blob/main/docs/"
Source = "https://github.com/mhahl/secretserver"

# ── Ruff (replaces ruff.toml) ──────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (Flask patterns)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "auth", "crypto", "integrations", "secret_svc", "ui", "lib", "routes", "audit", "tests"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest (replaces pytest.ini) ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "app"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "live: opt-in tests against a running app, PostgREST, and ESO stack",
]

# ── Pyright (replaces pyrightconfig.json) ──────────────────────────────
[tool.pyright]
include = ["app"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedImport = false
reportUnusedFunction = false

# ── Mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
files = ["app"]

# ── Pylint (supplements .pylintrc) ─────────────────────────────────────
[tool.pylint.main]
jobs = 0
py-version = "3.12"
ignore-paths = ["tests"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 12
max-locals = 40
max-branches = 30
max-statements = 100

[tool.pylint.reports]
score = true
fail-under = 9.5
output-format = "colorized"

[tool.pylint.typecheck]
ignored-modules = ["ldap3", "qrcode", "pyotp"]
