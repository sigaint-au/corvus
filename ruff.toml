line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (Flask patterns)
]

[lint.isort]
known-first-party = ["lib", "routes", "tests"]

[format]
quote-style = "double"