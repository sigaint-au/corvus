name: secretserver

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secretserver
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
      - ./db/migrations/0002_rbac.sql:/docker-entrypoint-initdb.d/02-rbac.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  softhsm2:
    build:
      context: .
      dockerfile: softhsm2/Dockerfile
    environment:
      HSM_TOKEN_LABEL: ${HSM_TOKEN_LABEL:-secretserver}
      HSM_SO_PIN: ${HSM_SO_PIN:-1234}
      HSM_PIN: ${HSM_PIN:-1234}
      # Shared volume path must be world-traversable for appuser (uid 10001).
      # Do not use /var/lib/softhsm (package dir is root:softhsm 770).
      SOFTHSM2_TOKEN_DIR: /hsm/tokens
      SOFTHSM2_CONF: /hsm/tokens/softhsm2.conf
    volumes:
      - hsmdata:/hsm/tokens
    healthcheck:
      test: ["CMD-SHELL", "test -f /hsm/tokens/.ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgrest:
    image: docker.io/postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/secretserver
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars!!}
      PGRST_DB_EXTRA_SEARCH_PATH: public
    ports:
      - "3000:3000"

  app:
    build: .
    image: localhost/secretserver_app:latest
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
      softhsm2:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://authenticator:authenticator@db:5432/secretserver
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/secretserver
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars!!}
      MASTER_KEY: ${MASTER_KEY:-dev-master-key-change-in-prod!!}
      SECRET_KEY: ${SECRET_KEY:-flask-session-secret-change-me}
      POSTGREST_URL: http://postgrest:3000
      GLOBAL_ADMIN_EMAIL: ${GLOBAL_ADMIN_EMAIL:-}
      # SoftHSM2 token dir (the app resolves HSM slots by PKCS#11 URL, which
      # points at libsofthsm2.so and this token directory).
      SOFTHSM2_CONF: /hsm/tokens/softhsm2.conf
      HSM_ALLOWED_MODULE_DIRS: /usr/lib,/usr/local/lib,/lib
      # Opt-in only — default off so refuse_insecure_defaults() actually runs.
      # For local play with baked-in secrets: ALLOW_INSECURE_DEFAULTS=1
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-0}
    volumes:
      - hsmdata:/hsm/tokens
    ports:
      - "8080:8080"
    # Hardened runtime: non-root image USER + drop caps + read-only root FS
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /home/appuser:size=16M,mode=1777

volumes:
  pgdata:
  hsmdata:
