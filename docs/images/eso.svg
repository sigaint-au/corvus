<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="ESO machine token flow">
  <rect width="900" height="420" rx="12" fill="#0c0e10"/>
  <text x="40" y="48" fill="#e8eaed" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700">Cluster path</text>
  <text x="40" y="74" fill="#9aa1a9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Machine token → ESO webhook → pod secret</text>

  <!-- boxes -->
  <rect x="40" y="120" width="200" height="100" rx="10" fill="#1a2228" stroke="#252a30"/>
  <text x="140" y="160" text-anchor="middle" fill="#e8eaed" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Secret Server</text>
  <text x="140" y="185" text-anchor="middle" fill="#47817F" font-family="ui-monospace,Menlo,monospace" font-size="12">ss_… token</text>
  <text x="140" y="205" text-anchor="middle" fill="#6b727a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">project-scoped</text>

  <path d="M250 170 H320" stroke="#47817F" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#47817F"/>
    </marker>
  </defs>

  <rect x="330" y="120" width="200" height="100" rx="10" fill="#1a2228" stroke="#252a30"/>
  <text x="430" y="160" text-anchor="middle" fill="#e8eaed" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">ESO</text>
  <text x="430" y="185" text-anchor="middle" fill="#9aa1a9" font-family="ui-monospace,Menlo,monospace" font-size="11">/eso/v1/…/secrets/KEY</text>
  <text x="430" y="205" text-anchor="middle" fill="#6b727a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">jsonPath: $.value</text>

  <path d="M540 170 H610" stroke="#47817F" stroke-width="2" marker-end="url(#a)"/>

  <rect x="620" y="120" width="240" height="100" rx="10" fill="#1a2228" stroke="#252a30"/>
  <text x="740" y="160" text-anchor="middle" fill="#e8eaed" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Kubernetes Secret</text>
  <text x="740" y="185" text-anchor="middle" fill="#9aa1a9" font-family="ui-monospace,Menlo,monospace" font-size="11">synced into the cluster</text>
  <text x="740" y="205" text-anchor="middle" fill="#6b727a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">read-only machine role</text>

  <rect x="40" y="270" width="820" height="110" rx="10" fill="#121518" stroke="#252a30"/>
  <text x="60" y="305" fill="#47817F" font-family="ui-monospace,Menlo,monospace" font-size="13">GET /eso/v1/projects/{id}/secrets/{key}</text>
  <text x="60" y="330" fill="#9aa1a9" font-family="ui-monospace,Menlo,monospace" font-size="13">Authorization: Bearer ss_…</text>
  <text x="60" y="355" fill="#e8eaed" font-family="ui-monospace,Menlo,monospace" font-size="13">→ {"value": "…"}</text>
</svg>
