{% extends "emails/_layout.html" %}
{% block body %}
<h1 style="margin:0 0 12px;font-size:18px;font-weight:600;color:#000000;">Due items</h1>
{% if lines %}
<p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#000000;">These items need attention:</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
  {% for line in lines %}
  <tr>
    <td style="padding:6px 0;font-size:14px;line-height:1.5;color:#000000;border-bottom:1px solid #f0f1f2;">
      <span style="color:#47817F;">&bull;</span>&nbsp; {{ line }}
    </td>
  </tr>
  {% endfor %}
</table>
{% endif %}
<p style="margin:0;font-size:13px;line-height:1.5;color:#57626e;">Review these items in {{ app_name }}.</p>
{% endblock %}
