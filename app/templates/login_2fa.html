{% extends "base.html" %}
{% block title %}Two-factor authentication - {{ app_name }}{% endblock %}
{% block body %}
<h1>Two-factor authentication</h1>
<p class="muted">
  Enter the 6-digit code from your authenticator app
  {% if email %}for <strong>{{ email }}</strong>{% endif %},
  or a recovery code.
</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label>Authentication code
    <input type="text" name="code" required autocomplete="one-time-code"
           inputmode="numeric" pattern="[0-9A-Za-z\- ]{6,20}"
           placeholder="123456 or xxxx-xxxx" autofocus>
  </label>
  <button type="submit">Verify</button>
</form>
<form method="post" action="{{ url_for('logout') }}" class="inline">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <button type="submit" class="ghost">Log out</button>
</form>
{% endblock %}
