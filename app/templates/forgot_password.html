{% extends "base.html" %}
{% block title %}Forgot password — {{ app_name }}{% endblock %}
{% block body %}
<h1>Forgot password</h1>
<p class="muted">
  Enter the email for your <strong>local</strong> account.
  LDAP directory passwords cannot be reset here.
</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label>Account email
    <input type="email" name="email" required autocomplete="username">
  </label>
  <button type="submit">Request reset</button>
</form>
<p class="muted"><a href="{{ url_for('login') }}">← Back to sign in</a></p>
{% endblock %}
