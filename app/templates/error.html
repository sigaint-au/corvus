<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/oat.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="err-page">
  <main class="error-standalone">
    <p class="error-brand">{{ brand_name or 'Sigaint' }}</p>
    <p class="error-code" role="status">{{ code }}</p>
    <p class="error-title">{{ title }}</p>
    <p><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </main>
</body>
</html>
