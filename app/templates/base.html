<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/oat.min.css') }}"
        integrity="sha384-JgFR/WT/tNMyAymGWeBuTU40xLejiR+zesrbgi0nNGwfiojII7kU3jkZ9obHFha">
  <script src="{{ url_for('static', filename='vendor/oat.min.js') }}" defer
          integrity="sha384-eJVbbdVUAZ/FEhLkv5jBwfngbELmd929nOOAH6CbbJpNb6MZga0aYEEd+VgaJV+O"></script>
  <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}"
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CfCeFReSfwBWDTK1pkzPP8c+cLsK+V"</script>
  <meta name="csrf-token" content="{{ csrf_token }}">
  
  
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="{% if session.get('user_id') %}app{% else %}auth{% endif %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% if classification and classification.enabled %}
  <div class="class-banner"
       style="background: {{ classification.color }}; color: {{ classification.fg }};"
       role="status">{{ classification.text }}</div>
  {% endif %}

  {% if session.get('user_id') %}
  <div class="shell">
  <aside class="sidebar" id="app-sidebar">
    <div class="side-head">
      <a class="brand" href="{{ url_for('projects_list') }}">
        {{ brand_name or 'Sigaint' }}
        {% if brand_tagline %}<span class="brand-sub">{{ brand_tagline }}</span>{% endif %}
      </a>
      <button type="button" class="side-toggle" id="side-toggle"
              aria-controls="app-sidebar" aria-expanded="false"
              aria-label="Open navigation menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
    <form class="side-search" method="get" action="{{ url_for('global_search') }}" role="search">
      <fieldset class="group search-input">
        {% include "partials/search_icon.html" %}
        <input type="search" id="side-search-q" name="q"
               placeholder="Search" autocomplete="off" aria-label="Search"
               value="{{ request.args.get('q','') if request.endpoint == 'global_search' else '' }}">
      </fieldset>
    </form>
    <form class="side-team" method="post" action="{{ url_for('select_team') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      {# Include query (e.g. ?tab=secrets) so team switch can land on the right list #}
      <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}">
      <label for="side-team-select">Team</label>
      <select id="side-team-select" name="team_id" onchange="this.form.submit()"
              aria-label="Team">
        {% if not nav_teams %}
        <option value="">No teams</option>
        {% else %}
        {% for t in nav_teams %}
        <option value="{{ t.id }}" {% if nav_team_id == t.id|string %}selected{% endif %}>{{ t.name }}</option>
        {% endfor %}
        {% endif %}
      </select>
    </form>
    {% set ep = request.endpoint or '' %}
    {% set workspace_eps = (
      'projects_list', 'project_detail', 'create_secret', 'delete_secret',
      'reveal_secret', 'create_token', 'delete_token', 'create_project', 'new_project_wizard',
      'secrets_list', 'shared_secrets_list', 'machines_list', 'trash', 'global_search'
    ) %}
    {% set account_eps = (
      'teams', 'create_team', 'team_detail', 'add_team_binding',
      'add_team_ldap_map', 'delete_team_ldap_map', 'delete_team',
      'delete_project_from_team', 'access_requests_inbox'
    ) %}
    {% set access_eps = (
      'access_requests_inbox',
    ) %}
    {% set admin_eps = (
      'admin_audit', 'admin_audit_access_export', 'admin_audit_export',
      'server_settings',
      'rbac_bindings', 'rbac_bindings_create', 'rbac_bindings_delete',
      'rbac_roles', 'rbac_roles_create', 'rbac_roles_delete',
      'rbac_access_review',
    ) %}
    {# Role-bindings nav: the Organisation item is team/project/secret-scoped; the
       Administration item is the general (scope-less) view. Highlight exactly one. #}
    {% set is_rbac_bindings = ep in ('rbac_bindings', 'rbac_bindings_create', 'rbac_bindings_delete') %}
    {% set rbac_scoped = (request.args.get('scope_id') or ''|string)|string %}
    {# Server defaults only used until localStorage preference is set #}
    {% set workspace_open = ep in workspace_eps or (ep != 'profile' and ep not in account_eps and ep not in access_eps and ep not in admin_eps) %}
    {% set account_open = ep in account_eps %}
    {% set access_open = ep in access_eps %}
    {% set admin_open = ep in admin_eps %}
    <nav aria-label="Main">
      <details class="side-group" data-side-group="workspace"{% if workspace_open %} open{% endif %}>
        <summary>Workspace</summary>
        <div class="side-group-body">
          <a class="side-nav-link {% if ep in ('projects_list', 'project_detail', 'create_secret', 'delete_secret', 'reveal_secret', 'create_token', 'delete_token', 'create_project', 'new_project_wizard') %}active{% endif %}{% if ep in ('projects_list', 'project_detail', 'create_secret', 'delete_secret', 'reveal_secret', 'create_token', 'delete_token', 'create_project', 'new_project_wizard') %} aria-current="page"{% endif %}"
             href="{{ url_for('projects_list') }}">Projects</a>
          <a class="side-nav-link {% if ep == 'secrets_list' %}active{% endif %}{% if ep == 'secrets_list' %} aria-current="page"{% endif %}"
             href="{{ url_for('secrets_list') }}">Secrets</a>
          <a class="side-nav-link {% if ep == 'shared_secrets_list' %}active{% endif %}{% if ep == 'shared_secrets_list' %} aria-current="page"{% endif %}"
             href="{{ url_for('shared_secrets_list') }}">Shared secrets</a>
          <a class="side-nav-link {% if ep == 'machines_list' %}active{% endif %}{% if ep == 'machines_list' %} aria-current="page"{% endif %}"
             href="{{ url_for('machines_list') }}">Machine accounts</a>
          <a class="side-nav-link {% if ep == 'trash' %}active{% endif %}{% if ep == 'trash' %} aria-current="page"{% endif %}"
             href="{{ url_for('trash') }}">Trash</a>
        </div>
      </details>
      <details class="side-group" data-side-group="account"{% if account_open %} open{% endif %}>
        <summary>Organisation</summary>
        <div class="side-group-body">
           <a class="side-nav-link {% if ep in ('teams', 'create_team', 'team_detail', 'add_team_binding', 'add_team_ldap_map', 'delete_team_ldap_map', 'delete_team', 'delete_project_from_team') %}active{% endif %}{% if ep in ('teams', 'create_team', 'team_detail', 'add_team_binding', 'add_team_ldap_map', 'delete_team_ldap_map', 'delete_team', 'delete_project_from_team') %} aria-current="page"{% endif %}"
              href="{{ url_for('teams') }}">Teams</a>
           {% if not is_global_admin and session.get('team_id') %}
           <a class="side-nav-link {% if is_rbac_bindings and rbac_scoped %}active{% endif %}{% if is_rbac_bindings and rbac_scoped %} aria-current="page"{% endif %}"
              href="{{ url_for('rbac_bindings', scope='team', scope_id=session.get('team_id')) }}">Role bindings</a>
           {% endif %}
          <a class="side-nav-link {% if ep == 'access_requests_inbox' %}active{% endif %}{% if ep == 'access_requests_inbox' %} aria-current="page"{% endif %}"
             href="{{ url_for('access_requests_inbox') }}">Access requests{% if nav_access_pending %}<span class="tab-badge" title="{{ nav_access_pending }} pending">{{ nav_access_pending }}</span>{% endif %}</a>
        </div>
      </details>
      <details class="side-group" data-side-group="profile"{% if ep == 'profile' %} open{% endif %}>
        <summary>Account</summary>
        <div class="side-group-body">
          <a class="side-nav-link {% if ep == 'profile' %}active{% endif %}{% if ep == 'profile' %} aria-current="page"{% endif %}"
             href="{{ url_for('profile') }}">My profile</a>
        </div>
      </details>
      {% if is_global_admin %}
      <details class="side-group" data-side-group="administration"{% if admin_open %} open{% endif %}>
        <summary>Administration</summary>
        <div class="side-group-body">
          <a class="side-nav-link {% if is_rbac_bindings and not rbac_scoped %}active{% endif %}{% if is_rbac_bindings and not rbac_scoped %} aria-current="page"{% endif %}"
             href="{{ url_for('rbac_bindings', scope='team') }}">Role bindings</a>
          <a class="side-nav-link {% if ep in ('rbac_roles', 'rbac_roles_create', 'rbac_roles_delete') %}active{% endif %}{% if ep in ('rbac_roles', 'rbac_roles_create', 'rbac_roles_delete') %} aria-current="page"{% endif %}"
             href="{{ url_for('rbac_roles') }}">Roles</a>
          <a class="side-nav-link {% if ep == 'rbac_access_review' %}active{% endif %}{% if ep == 'rbac_access_review' %} aria-current="page"{% endif %}"
             href="{{ url_for('rbac_access_review') }}">Access review</a>
          <a class="side-nav-link {% if ep in ('admin_audit', 'admin_audit_access_export', 'admin_audit_export') %}active{% endif %}{% if ep in ('admin_audit', 'admin_audit_access_export', 'admin_audit_export') %} aria-current="page"{% endif %}"
             href="{{ url_for('admin_audit') }}">Auditing</a>
          <a class="side-nav-link {% if ep == 'server_settings' %}active{% endif %}{% if ep == 'server_settings' %} aria-current="page"{% endif %}"
             href="{{ url_for('server_settings') }}">Server settings</a>

        </div>
      </details>
      {% endif %}
    </nav>
    {% include "partials/side_pins.html" %}
    {% if nav_recent %}
    <details class="side-list side-group" id="side-recent" data-side-group="recent" open>
      <summary class="side-list-label">Recent</summary>
      <div class="side-group-body">
      {% for s in nav_recent %}
      <a class="side-list-item" href="{{ url_for('project_detail', project_id=s.project_id, tab='secrets', q=s.key) }}"
         title="{{ s.team_name }} / {{ s.project_name }}">
        <span class="side-list-key">{{ s.key }}</span>
        <span class="side-list-meta">{{ s.project_name }}</span>
      </a>
      {% endfor %}
      </div>
    </details>
    {% endif %}
    <div class="sidebar-foot">
      <div class="who">
        <a class="who-email" href="{{ url_for('profile') }}" title="{{ session.email }} - My profile">{{ session.email }}</a>
        {% if is_global_admin %}<span class="badge" data-variant="secondary">Global admin</span>{% endif %}
      </div>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <button type="submit" class="logout-link">Log out</button>
      </form>
    </div>
  </aside>
  <button type="button" class="side-backdrop" id="side-backdrop" aria-label="Close navigation menu"></button>
  
  <div class="main" id="main-content">
  {% else %}
  <div class="auth-wrap">
  <div class="auth-card">
    <a class="auth-brand" href="{{ url_for('login') }}">
      {{ brand_name or 'Sigaint' }}
      {% if brand_tagline %}<span class="brand-sub">{{ brand_tagline }}</span>{% endif %}
    </a>
  {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        {# oat.ink Alert #}
        <div role="alert"{% if cat in ('error', 'danger') %} data-variant="error"{% elif cat in ('ok', 'success') %} data-variant="success"{% elif cat == 'warning' %} data-variant="warning"{% endif %}>
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block body %}{% endblock %}
  </div>
  {% if session.get('user_id') %}
  </div>
  {% else %}
  </div>
  {% endif %}
  <datalist id="user-suggest-list"></datalist>
  
  
  
  
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
