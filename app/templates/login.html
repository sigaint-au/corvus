{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block body %}
<h1>Sign in</h1>
{% if ldap_enabled %}
<p class="muted">Local accounts and LDAP directory logins are accepted.</p>
{% endif %}
<form method="post">
  <label>{% if ldap_enabled %}Email or username{% else %}Email{% endif %}
    <input type="{% if ldap_enabled %}text{% else %}email{% endif %}"
           name="email" required autocomplete="username">
  </label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<p class="muted">No account? <a href="{{ url_for('register') }}">Register</a>
  {% if ldap_enabled %} <span>(local account)</span>{% endif %}
</p>
{% endblock %}
