{% extends "base.html" %}
{% block title %}Trash - {{ app_name }}{% endblock %}
{% block body %}
<div class="page-head">
  <h1>Trash</h1>
  {% if team %}
  <div class="section-tools">
    {% if items %}
    <div class="bulk-toolbar" id="bulk-toolbar" hidden>
      <label class="bulk-select" title="Select all on this page">
        <input type="checkbox" id="bulk-select-all" aria-label="Select all trash items">
        <span id="bulk-count" class="bulk-count">0</span>
      </label>
      <label class="visually-hidden" for="bulk-action">Bulk action</label>
      <select id="bulk-action" class="bulk-action" aria-label="Bulk action">
        <option value="">Action…</option>
        <option value="restore"
                data-url="{{ url_for('bulk_trash') }}"
                data-confirm="Restore {n} selected secret(s)?">Restore</option>
        <option value="purge"
                data-url="{{ url_for('bulk_trash') }}">Delete forever</option>
      </select>
      <button type="button" id="bulk-apply" class="bulk-apply" disabled>Apply</button>
    </div>
    {% endif %}
    <form method="get" action="{{ url_for('trash') }}" class="toolbar" role="search"
          hx-get="{{ url_for('trash') }}"
          hx-target="#trash-results"
          hx-swap="outerHTML"
          hx-push-url="true"
          hx-trigger="submit, input delay:250ms from:input[name=q]">
      <fieldset class="group search-input">
        {% include "partials/search_icon.html" %}
        <input type="search" name="q" value="{{ search_q or '' }}"
               placeholder="Search" autocomplete="off" aria-label="Search trash">
      </fieldset>
      {% if search_q %}
      <a class="button ghost small" href="{{ url_for('trash') }}"
         hx-get="{{ url_for('trash') }}"
         hx-target="#trash-results"
         hx-swap="outerHTML"
         hx-push-url="true">Clear</a>
      {% endif %}
    </form>
  </div>
  {% endif %}
</div>

{% include "partials/trash_results.html" %}
{% endblock %}
