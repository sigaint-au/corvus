{% if secrets %}
<table>
  <thead><tr><th>Key</th><th>Note</th><th>Updated</th><th></th></tr></thead>
  <tbody>
  {% for s in secrets %}
    <tr>
      <td><code class="k">{{ s.key }}</code></td>
      <td class="muted">{{ s.note }}</td>
      <td class="muted">{{ s.updated_at }}</td>
      <td class="row" style="flex:0;">
        <button type="button"
                hx-get="{{ url_for('reveal_secret', project_id=project_id if project_id is defined else project.id, secret_id=s.id) }}"
                hx-target="#reveal-{{ s.id }}"
                hx-swap="innerHTML">Reveal</button>
        {% if can_write %}
        <form method="post"
              action="{{ url_for('delete_secret', project_id=project_id if project_id is defined else project.id, secret_id=s.id) }}"
              hx-post="{{ url_for('delete_secret', project_id=project_id if project_id is defined else project.id, secret_id=s.id) }}"
              hx-target="#secrets-list"
              hx-swap="innerHTML"
              class="inline"
              onsubmit="return confirm('Delete {{ s.key }}?')">
          <button type="submit">Delete</button>
        </form>
        {% endif %}
      </td>
    </tr>
    <tr><td colspan="4" id="reveal-{{ s.id }}"></td></tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">No secrets in this project.</p>
{% endif %}
