{# Masked value; when reveal_url is set, click reveals into cell_id. #}
{% if reveal_url and cell_id %}
<a href="{{ reveal_url }}"
   class="secret-masked"
   hx-get="{{ reveal_url }}"
   hx-target="#{{ cell_id }}"
   hx-swap="innerHTML"
   title="Reveal secret"
   aria-label="Reveal secret">*******</a>
{% else %}
<code class="k secret-masked">*******</code>
{% endif %}
