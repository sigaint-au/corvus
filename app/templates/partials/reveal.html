{% if editable and can_write %}
<form class="reveal-edit"
      hx-post="{{ url_for('update_secret_value', project_id=project_id, secret_id=secret_id) }}"
      hx-target="closest .secret-cell"
      hx-swap="innerHTML">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <span class="input-with-btn">
    <input type="text" name="value" class="secret-value" value="{{ value }}"
           autocomplete="off" required>
    <button type="submit" class="icon-btn save-btn" title="Save value">Save</button>
  </span>
</form>
{% else %}
<input type="text" class="secret-value" value="{{ value }}" readonly onclick="this.select()" title="Click to select">
{% endif %}
