{# Copy-login-command dialog. Opened from the sidebar footer.
   On open it shows a "Generate command" button; submitting swaps in the
   freshly minted command + Copy button via cli_login_command. #}
<dialog id="cli-login-dlg" closedby="any" class="access-dlg" aria-labelledby="cli-login-dlg-title">
  <form method="post"
        action="{{ url_for('cli_login_command') }}"
        hx-post="{{ url_for('cli_login_command') }}"
        hx-target="#cli-login-dlg"
        hx-swap="innerHTML"
        id="cli-login-dlg-form">
    <header>
      <h3 id="cli-login-dlg-title">CLI login command</h3>
      <p>Generate a short-lived token and a ready-to-paste <code>corvus login</code> command.</p>
    </header>
    <div>
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    </div>
    <footer>
      <button type="button" class="outline" data-close-dialog="cli-login-dlg">Cancel</button>
      <button type="submit">Generate command</button>
    </footer>
  </form>
</dialog>
