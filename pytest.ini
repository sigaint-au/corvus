[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Repo root (tests package) + app/ (flat Flask modules on PYTHONPATH)
pythonpath = . app
addopts =
    -q
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    live: opt-in tests against a running app, PostgREST, and ESO stack
