[tox]
envlist = py, lint
skipsdist = true

[testenv]
description = Unit tests (pytest)
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/app
    # Unit tests mock DB; unreachable DSN with short timeout if a mock is missed.
    DATABASE_URL = postgres://test:test@127.0.0.1:1/test?connect_timeout=1
    DATABASE_ADMIN_URL = postgres://test:test@127.0.0.1:1/test?connect_timeout=1
    JWT_SECRET = dev-jwt-secret-change-me-32chars!!
    MASTER_KEY = dev-master-key-change-in-prod!!
    SECRET_KEY = flask-session-secret-change-me
    ALLOW_INSECURE_DEFAULTS = 1
deps =
    -r{toxinidir}/app/requirements.txt
    -r{toxinidir}/requirements-dev.txt
commands =
    pytest {posargs}

[testenv:lint]
description = Pylint on application code (exclude tests)
changedir = {toxinidir}/app
setenv =
    PYTHONPATH = {toxinidir}/app
    DATABASE_URL = postgres://x
    DATABASE_ADMIN_URL = postgres://x
    JWT_SECRET = dev-jwt-secret-change-me-32chars!!
    MASTER_KEY = dev-master-key-change-in-prod!!
    SECRET_KEY = flask-session-secret-change-me
    ALLOW_INSECURE_DEFAULTS = 1
deps =
    -r{toxinidir}/app/requirements.txt
    pylint==3.3.6
commands =
    pylint --rcfile={toxinidir}/.pylintrc \
        app.py audit authz.py config.py crypto.py db.py dir_sync.py \
        ldap_auth.py lockout.py mailer.py migrations.py nav.py oidc_auth.py paging.py \
        passwords.py pats.py pins.py schema.py secret_kinds.py secret_ops.py \
        settings_svc.py totp_svc.py user_sessions.py \
        lib routes
