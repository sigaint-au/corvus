apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# High-availability base composition for Secret Server.
# This application IS the secrets store for other systems — it does NOT
# fetch its own bootstrap credentials from an external store. The DATABASE
# / REDIS / POSTGREST bootstrap Secrets must exist in the namespace before
# the workloads reconcile (see deploy/README.md → "Secrets bootstrap").
# Overlay (e.g. overlays/prod) is where replicas, ingress hostnames,
# resource quotas, and replica-count tuning belong.
namespace: secretserver

# Labels propagated to every resource. `includeSelectors: false` keeps
# matchLabels/clusterIP selectors unchanged so we don't accidentally broaden
# selectors beyond their declared scope.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: secretserver
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - rbac
  - app
  - postgrest
  - postgres
  - redis
  - secrets
  - ingress
  - networkpolicies
