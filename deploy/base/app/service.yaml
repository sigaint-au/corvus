apiVersion: v1
kind: Service
metadata:
  name: corvus-app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: corvus
spec:
  type: ClusterIP
  clusterIP: None   # headless — Ingress uses endpoints directly, no kube-proxy hop
  selector:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: corvus
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
  publishNotReadyAddresses: false
