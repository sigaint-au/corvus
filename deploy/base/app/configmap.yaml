apiVersion: v1
kind: ConfigMap
metadata:
  name: secretserver-app-env
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: secretserver
data:
  # Non-secret runtime env for the Flask app. Sensitive values (DB creds,
  # MASTER_KEY / JWT_SECRET / SECRET_KEY) are sourced from ESO-managed
  # Secrets and referenced via env.valueFrom.secretKeyRef in deployment.yaml.
  POSTGREST_URL: "http://secretserver-postgrest:3000"
  # Sentinel-fronted Redis: client connects to the sentinels, sentinels
  # return the current master. URL includes sentinel service name; the
  # app's redis client must be sentinel-aware (cache.py uses from_url()
  # which is sufficient when pointed at a headless sentinel service that
  # returns the master's ARecord).
  REDIS_URL: "redis://redis-sentinel:26379/0"
  REDIS_DEK_CACHE_TTL: "300"
  # Force Secure cookies behind ingress TLS.
  COOKIE_SECURE: "1"
  # External HSM by default — module dirs are still required by the loader
  # so python-pkcs11 can dlopen() the operator's PKCS#11 library when
  # reachable via a CSI driver or mounted ConfigMap of the lib.
  SOFTHSM2_CONF: ""
  HSM_ALLOWED_MODULE_DIRS: "/usr/lib,/usr/local/lib,/lib,/opt/hsm/lib"
  HSM_TEST_TIMEOUT_SECONDS: "10"
  # Schema bootstrap safety net: refuse insecure defaults in non-dev.
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Where log lines go — k8s captures stdout/stderr.
  GUNICORN_CMD_ARGS: "--access-logfile - --error-logfile -"
  # Optional — promote this email once on first start when no global admin
  # exists yet. Operators usually leave this empty after bootstrap.
  GLOBAL_ADMIN_EMAIL: ""
