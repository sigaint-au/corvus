apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secretserver-app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: secretserver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secretserver-app
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # avoid flapping during traffic dips
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
