# ExternalSecret: per-namespace Kubernetes Secrets sourced from Vault.
# ESO reconciles every 5 minutes; refreshInterval drops to 1m for app
# secrets that change on rotation (MASTER_KEY).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-app-secrets
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  # Refresh frequently so MASTER_KEY / JWT_SECRET rotations propagate.
  refreshInterval: 5m
  # Rotation hook: ESO triggers an annotation-based rollout annotation
  # on the consuming Deployment. (Configured per workload.)
  target:
    name: secretserver-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          # CNPG-style force-refresh stamp; app uses env-only refs so this
          # is informational only — secret references don't reload until
          # pod restart. Operators roll the Deployment to pick up changes.
          secretserver.sigaint/rotation: "{{ .rotationTime }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secretserver/app
        property: database_url
    - secretKey: DATABASE_ADMIN_URL
      remoteRef:
        key: secretserver/app
        property: database_admin_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: secretserver/app
        property: jwt_secret
    - secretKey: MASTER_KEY
      remoteRef:
        key: secretserver/app
        property: master_key
    - secretKey: SECRET_KEY
      remoteRef:
        key: secretserver/app
        property: secret_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-postgrest-secrets
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: secretserver-postgrest-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGRST_DB_URI
      remoteRef:
        key: secretserver/postgrest
        property: db_uri
    - secretKey: PGRST_JWT_SECRET
      remoteRef:
        key: secretserver/postgrest
        property: jwt_secret
---
# CloudNativePG bootstraps its cluster from `secretserver-postgres-superuser`
# (superuser) and `secretserver-postgres-authenticator` (app role).
# Both must exist BEFORE the Cluster resource is reconciled.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-postgres-superuser
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: secretserver-postgres-superuser
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secretserver/postgres
        property: superuser_username
    - secretKey: password
      remoteRef:
        key: secretserver/postgres
        property: superuser_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-postgres-authenticator
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: secretserver-postgres-authenticator
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secretserver/postgres
        property: app_username
    - secretKey: password
      remoteRef:
        key: secretserver/postgres
        property: app_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-redis-secrets
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: secretserver-redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secretserver/redis
        property: password
    - secretKey: REDIS_SENTINEL_PASSWORD
      remoteRef:
        key: secretserver/redis
        property: sentinel_password
---
# CloudNativePG barman-cloud-plugin credentials — Object-store backups.
# Used by the operator when method=barmanObjectStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secretserver-postgres-backup
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: secretserver
spec:
  secretStoreRef:
    name: secretserver-vault
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: secretserver-postgres-backup
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secretserver/postgres-backup
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secretserver/postgres-backup
        property: aws_secret_access_key
    - secretKey: AWS_REGION
      remoteRef:
        key: secretserver/postgres-backup
        property: aws_region
    - secretKey: AWS_ENDPOINT
      remoteRef:
        key: secretserver/postgres-backup
        property: aws_endpoint
    - secretKey: AWS_BUCKET
      remoteRef:
        key: secretserver/postgres-backup
        property: aws_bucket
