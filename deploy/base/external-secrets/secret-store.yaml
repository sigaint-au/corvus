# ClusterSecretStore — Vault KV-v2 backend. Operators create the Vault
# policy / role binding out of band. Switch to AWS/GCP/Azure Secrets Manager
# via overlays (replace kind & spec.provider).
#
# Prerequisites:
#   * External Secrets Operator installed cluster-wide
#     (`helm install external-secrets external-secrets/external-secrets`).
#   * Vault policy + Kubernetes auth role that grants read on
#     `secret/data/secretserver/*`.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: secretserver-vault
  labels:
    app.kubernetes.io/part-of: secretserver
spec:
  provider:
    vault:
      server: "https://vault.example.internal:8200"
      # Auth method: Kubernetes service account JWT.
      auth:
        kubernetes:
          mountPath: kubernetes
          role: secretserver-app
          serviceAccountRef:
            name: external-secrets-reader
            namespace: secretserver
          audiences:
            - vault
      path: secret
      version: v2
