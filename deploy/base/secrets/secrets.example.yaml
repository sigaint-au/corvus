# Template only — DO NOT apply as-is. `data:` blocks are empty so the
# file is valid YAML but Pods will not start until operators populate
# the required keys. Use `scripts/bootstrap-secrets.sh` to generate
# random Secrets safely.
apiVersion: v1
kind: Secret
metadata:
  name: corvus-app-secrets
  namespace: corvus
  labels:
    app.kubernetes.io/part-of: corvus
type: Opaque
stringData:
  DATABASE_URL: ""
  DATABASE_ADMIN_URL: ""
  JWT_SECRET: ""
  MASTER_KEY: ""
  SECRET_KEY: ""
---
apiVersion: v1
