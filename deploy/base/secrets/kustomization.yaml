apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This directory is a templates + docs package for operator-managed
# Secrets. It does NOT auto-create Secrets at apply time — the
# `secrets.example.yaml` file ships with empty `stringData:` blocks
# and is committed only as a structural reference. Operators bootstrap
# real values via the helper script `scripts/bootstrap-secrets.sh`, or
# via their preferred toolchain (sealed-secrets, CI/CD with kubectl,
# etc.).
#
# Why not commit live Secrets: real passwords / keys / DB credentials
# would leak through git history. Why not use ESO: this application IS
# the secrets store for other systems — its own bootstrap credentials
# are managed in-cluster by the operator, not pulled from a third-party
# vault.
#
# This kustomization produces no live cluster objects — `resources: []`
# is explicit so kustomize accepts it as a valid (but empty) base.
resources: []
