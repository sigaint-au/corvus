apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secretserver-postgrest
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: secretserver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secretserver-postgrest
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
