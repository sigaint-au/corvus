apiVersion: v1
kind: ConfigMap
metadata:
  name: secretserver-postgrest-env
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: secretserver
data:
  # Database schema exposed by PostgREST. The app's migrations create the
  # `api` schema and RLS-protected tables; PostgREST publishes them read-only
  # for the app and machine-token holders.
  PGRST_DB_SCHEMAS: "api"
  PGRST_DB_ANON_ROLE: "anon"
  PGRST_DB_EXTRA_SEARCH_PATH: "public"
  PGRST_OPENAPI_MODE: "disabled"
  PGRST_OPENAPI_SECURITY_ACTIVE: "disabled"
  # Defaults tuned for short-lived machine-token traffic.
  PGRST_DB_MAX_ROWS: "1000"
  PGRST_SERVER_PROXIED_PROTOCOL: ""
  # Hardening: trust the JWT, no anonymous writes; pre-flight options.
  PGRST_JWT_EXPECTED_AUDIENCE: ""
