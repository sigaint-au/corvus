apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secretserver-postgrest
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: secretserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgrest
      app.kubernetes.io/part-of: secretserver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the app reaches PostgREST.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
              app.kubernetes.io/part-of: secretserver
      ports:
        - port: 3000
          protocol: TCP
    # Probe traffic from kubelet.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 10.0.0.0/29
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Outbound to Postgres only.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: secretserver
      ports:
        - port: 5432
          protocol: TCP
