apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corvus-postgrest
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: corvus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgrest
      app.kubernetes.io/part-of: corvus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the app reaches PostgREST.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 3000
          protocol: TCP
    # Probe traffic from kubelet across private cluster CIDRs.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Outbound to Postgres only.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 5432
          protocol: TCP
