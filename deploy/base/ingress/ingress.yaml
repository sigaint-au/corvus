# Ingress — TLS-terminated HTTPS at the cluster edge. Hostnames and class
# are overlays (staging vs prod differ on the host; both share ingress class).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secretserver
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: secretserver
  annotations:
    # Tight TLS: only TLS 1.2/1.3, modern ciphers.
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "EECDH+AESGCM:EDH+AESGCM"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    # Rate-limit: per-IP, defends against brute-force / secret scraping.
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Body size matches the app's MAX_CONTENT_LENGTH (16MB).
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # Backend keepalive to the pod — important for HTMX streaming.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # HSTS — 1 year, preload eligible.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # ExternalDNS sync.
    external-dns.alpha.kubernetes.io/hostname: "secretserver.example.internal"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - secretserver.example.internal
      secretName: secretserver-tls
  rules:
    - host: secretserver.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secretserver-app
                port:
                  name: http
