apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: corvus-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: corvus
spec:
  # With 3 instances and synchronous replication quorum, maxUnavailable=1
  # allows rolling node drains while always leaving 2/3 of the cluster
  # writable (or readable when primary is unavailable).
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: corvus
      cnpg.io/cluster: corvus-postgres
