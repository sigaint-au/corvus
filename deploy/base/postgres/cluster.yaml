# CloudNativePG (cnpg) Cluster — the canonical HA Postgres controller for K8s.
# Requires the CloudNativePG operator to be installed cluster-wide
# (see deploy/README.md for the install command).
#
# Why CloudNativePG:
#  * Self-healing streaming replication (primary + replicas).
#  * Automated point-in-time-recovery via barman-cloud (S3 / GCS / Azure).
#  * Built-in Prometheus metrics, connection-pooling (PgBouncer), fencing.
#  * Automated failover with switchover grace periods.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: corvus-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: corvus
spec:
  # 3 instances — primary + 2 replicas. Survives loss of one node.
  instances: 3
  # Sync replication quorum: writes return only when at least one replica
  # confirms receipt, guaranteeing no committed tx is lost on primary crash.
  synchronous:
    mode: quorum
  # Fencing prevents split-brain on a network partition by using the K8s API
  # to disable pod scheduling before initiating failover.
  fencing:
    enabled: true
    # Give a stuck primary up to 30s to recover before failover.
    timeout: 30
  # The app uses bootstrap migrations during the first request — keep CNPG
  # out of the way. The schema bootstrap lives in app/core/schema.py and
  # runs SQL from /db/migrations on startup.
  bootstrap:
    initdb:
      # Use the application's authenticator role naming convention.
      dataChecksums: true
      encoding: UTF8
      locale: en_US.UTF-8
  # Storage defaults to the cluster's default StorageClass.
  # The prod overlay patches storageClass to ssd-premium.
  storage:
    size: 50Gi
    resizeInUseVolumes: true
  walStorage:
    size: 16Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
  # Pod-level hardening matches the namespace PSS restricted profile.
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: corvus
    spec:
      priorityClassName: corvus-ha
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Operator sets restartPolicy; we just enforce security context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 26   # postgres UID inside the cnpg image
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 26
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  # Spread instances across zones/nodes for HA.
  affinity:
    topologyKey: topology.kubernetes.io/zone
    podAntiAffinityType: required
  # Operator-managed rolling restart on image change.
  imageCatalog: null
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  # The app uses `authenticator` role; CNPG creates the superuser + app
  # roles automatically on cluster bootstrap.
  postgresql:
    parameters:
      # Sensible production defaults for a workload that runs
      # crypto-heavy queries and frequent small writes.
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      max_connections: "200"
      wal_level: "replica"
      max_wal_senders: "10"
      max_replication_slots: "10"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      # CNPG adds hot_standby = on by default; keep it on for read replicas.
      hot_standby: "on"
      log_min_duration_statement: "1s"
      log_checkpoints: "on"
      log_connections: "off"
      log_disconnections: "off"
      log_lock_waits: "on"
      # Statement timeout protects the cluster from runaway queries.
      statement_timeout: "60s"
      # Row-level security is critical for this app — never disable.
      row_security: "on"
  # Application DB users (CNPG manages role DDL automatically on bootstrap).
  managed:
    roles:
      # The application's authenticator role — used for app connections.
      - name: corvus-app
        ensure: present
        login: true
        passwordSecret:
          name: corvus-postgres-authenticator
          key: password
        inRoles:
          - authenticator
          - corvus
      - name: corvus
        ensure: present
        login: false
        # Owner of the public and api schemas.
        inRoles:
          - pg_read_all_data
      - name: authenticator
        ensure: present
        login: false
        inRoles:
          - corvus
      - name: anon
        ensure: present
        login: false
        # The anonymous role PostgREST publishes — no privileges on tables.
  serviceAccountTemplate:
    metadata:
      name: corvus-postgres
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: corvus
    # CNPG needs API access for backups (s3 secret refs) and fencing.
    automountServiceAccountToken: true
