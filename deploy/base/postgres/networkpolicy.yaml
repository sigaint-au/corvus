apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corvus-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: corvus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: corvus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From the Flask application pods.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 5432
          protocol: TCP
    # From PostgREST pods.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgrest
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 5432
          protocol: TCP
    # Inter-instance replication and metrics within the Postgres cluster.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 9187
          protocol: TCP
    # From CloudNativePG Operator pods specifically in cnpg-system.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 9187
          protocol: TCP
    # Probe and metrics scraping from private cluster CIDRs.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 9187
          protocol: TCP
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Inter-replica streaming replication.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    # K8s API server for CNPG instance status updates and fencing.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
    # Outbound S3/GCS backup destinations (barman-cloud).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
