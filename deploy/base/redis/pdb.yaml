apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: corvus-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corvus
spec:
  # With 3 replicas + sentinel quorum=2, maxUnavailable=1 keeps a quorum
  # of sentinels and lets the cluster tolerate one voluntary disruption
  # while still electing a master.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: corvus
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: corvus-redis-sentinel
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/part-of: corvus
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-sentinel
      app.kubernetes.io/part-of: corvus
