apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-env
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corvus
data:
  # redis.conf — production defaults tuned for caching workloads with AOF.
  # Password and sentinel auth are injected via Secret env vars.
  REDIS_REPLICATION_MODE: "master-replica"
  REDIS_AOF_ENABLED: "yes"
  REDIS_AOF_USE_RDB_PREAMBLE: "yes"
  REDIS_APPENDONLY: "yes"
  REDIS_APPENDFSYNC: "everysec"
  REDIS_RDB_POLICY: "900:1,300:10,60:10000"   # save snapshots opportunistically
  REDIS_MAXMEMORY_POLICY: "allkeys-lru"
  REDIS_MAXMEMORY: "768mb"
  REDIS_TCP_KEEPALIVE: "60"
  REDIS_TIMEOUT: "0"   # disable client idle timeout
  REDIS_PROTECTED_MODE: "no"
  ALLOW_EMPTY_PASSWORD: "no"
  REDIS_DISABLE_COMMANDS: "FLUSHDB,FLUSHALL,CONFIG,DEBUG"
  REDIS_CLUSTER_ENABLED: "no"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corvus
data:
  redis.conf: |
    # Generated by the StatefulSet initContainer — see redis-statefulset.yaml.
    # Kept here as a fallback for re-bootstrap scenarios.
    bind 0.0.0.0
    protected-mode no
    tcp-keepalive 60
    appendonly yes
    appendfsync everysec
    maxmemory-policy allkeys-lru
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command CONFIG ""
    rename-command DEBUG ""
