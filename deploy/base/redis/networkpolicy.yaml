apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corvus-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: corvus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: corvus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From the app (Redis client).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 6379
          protocol: TCP
    # From sentinel pods (replication + sentinel gossip).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sentinel
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
    # From the failover controller (kubectl exec probes / health checks).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-failover-controller
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 6379
          protocol: TCP
        - port: 26379
          protocol: TCP
    # Probe / Prometheus metrics scrape traffic.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 6379
          protocol: TCP
        - port: 9121
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # To other Redis pods (replication).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 6379
          protocol: TCP
    # To sentinels.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sentinel
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corvus-redis-sentinel
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/part-of: corvus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-sentinel
      app.kubernetes.io/part-of: corvus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # From app (sentinel-aware clients).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
    # Inter-sentinel gossip.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sentinel
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
    # From Redis pods (replication check / sentinel info).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
    # From failover controller.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-failover-controller
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
    # Probe traffic.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - port: 26379
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sentinel
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corvus-redis-failover-controller
  labels:
    app.kubernetes.io/name: redis-failover-controller
    app.kubernetes.io/part-of: corvus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-failover-controller
      app.kubernetes.io/part-of: corvus
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Sentinel communication on port 26379 (redis-cli query for master)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-sentinel
              app.kubernetes.io/part-of: corvus
      ports:
        - port: 26379
          protocol: TCP
    # Kubernetes API server access (kubectl patch svc / label pods)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
