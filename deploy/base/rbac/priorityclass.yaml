apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: corvus-ha
  labels:
    app.kubernetes.io/part-of: corvus
value: 1000000
globalDefault: false
description: |
  Scheduling priority for Corvus HA workloads (app, postgrest,
  postgres, redis). High enough to survive node pressure but below the
  cluster's system priority classes so platform pods still preempt.
preemptionPolicy: PreemptLowerPriority
