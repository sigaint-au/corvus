# Minimal in-cluster RBAC for the redis failover controller only.
# CloudNativePG and the app/postgrest SAs run with
# automountServiceAccountToken: false and need no API access. Corvus
# itself manages its own runtime secrets (MASTER_KEY / JWT_SECRET /
# SECRET_KEY) — those are generated by the application on first start or
# rotated via `flask rekey-project-keys`, not sourced from an external
# store. Database and Redis bootstrap passwords are created directly as
# Kubernetes Secrets by the operator (see deploy/README.md → "Secrets
# bootstrap"); no extra RBAC is required to apply them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-failover-controller
  namespace: corvus
  labels:
    app.kubernetes.io/name: redis-failover-controller
    app.kubernetes.io/part-of: corvus
rules:
  # Watch Redis pods to detect role labels (master/replica) updated by sentinel.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Patch the redis-master Service selector on failover.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch"]
  # Surface pod events when the controller promotes / demotes a node.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-failover-controller
  namespace: corvus
  labels:
    app.kubernetes.io/part-of: corvus
subjects:
  - kind: ServiceAccount
    name: redis-failover-controller
    namespace: corvus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-failover-controller
