apiVersion: v1
kind: ServiceAccount
metadata:
  name: secretserver-app
  namespace: secretserver
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: secretserver
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secretserver-postgrest
  namespace: secretserver
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: secretserver
automountServiceAccountToken: false
---
# Used by the redis-failover-controller sidecar to patch the redis-master
# Service on sentinel-triggered failover. No other component uses this SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-failover-controller
  namespace: secretserver
  labels:
    app.kubernetes.io/name: redis-failover-controller
    app.kubernetes.io/part-of: secretserver
automountServiceAccountToken: true
