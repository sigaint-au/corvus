apiVersion: v1
kind: ServiceAccount
metadata:
  name: corvus-app
  namespace: corvus
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: corvus
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corvus-postgrest
  namespace: corvus
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: corvus
automountServiceAccountToken: false
---
# Used by the redis-failover-controller sidecar to patch the redis-master
# Service on sentinel-triggered failover. No other component uses this SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-failover-controller
  namespace: corvus
  labels:
    app.kubernetes.io/name: redis-failover-controller
    app.kubernetes.io/part-of: corvus
automountServiceAccountToken: true
