apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: corvus-postgres
spec:
  # Postgres server image — bump this (not an images: entry) to roll PG.
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: ssd-premium
    size: 200Gi
  walStorage:
    storageClass: ssd-premium
    size: 64Gi
  instances: 3
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
