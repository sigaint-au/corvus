apiVersion: v1
kind: ResourceQuota
metadata:
  name: corvus-prod
  namespace: corvus
  labels:
    app.kubernetes.io/part-of: corvus
spec:
  hard:
    # CPU / memory ceiling for the namespace.
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    # Persistent volume caps — Postgres + Redis + headroom.
    persistentvolumeclaims: "30"
    requests.storage: "1Ti"
    requests.ephemeral-storage: "100Gi"
    # Object counts.
    pods: "100"
    services: "50"
    secrets: "60"
    configmaps: "60"
    services.loadbalancers: "0"
    services.nodeports: "0"
