apiVersion: v1
kind: LimitRange
metadata:
  name: corvus-default
  namespace: corvus
  labels:
    app.kubernetes.io/part-of: corvus
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "64Mi"
      max:
        cpu: "4"
        memory: "4Gi"
        ephemeral-storage: "1Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
        ephemeral-storage: "32Mi"
    - type: PersistentVolumeClaim
      max:
        storage: "500Gi"
      min:
        storage: "1Gi"
