apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — single AZ-tolerant replica counts, self-signed TLS.
# Apply with:
#
#   kubectl apply -k deploy/overlays/staging
#
# Bootstrap-time Secrets are NOT managed by this overlay. Run
# `scripts/bootstrap-secrets.sh secretserver-staging` once before
# applying (see deploy/README.md → "Secrets bootstrap").

namespace: secretserver-staging

resources:
  - ../../base

# Replicas + HPA tuned for cost, not HA. Each patch entry targets exactly
# one resource by kind+name.
patches:
  - path: app-replicas-patch.yaml
    target:
      kind: Deployment
      name: secretserver-app
  - path: postgrest-replicas-patch.yaml
    target:
      kind: Deployment
      name: secretserver-postgrest
  - path: app-hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: secretserver-app
  - path: postgrest-hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: secretserver-postgrest
  - path: postgres-instances-patch.yaml
    target:
      kind: Cluster
      name: secretserver-postgres
  - path: redis-replica-patch.yaml
    target:
      kind: StatefulSet
      name: redis
  - path: redis-sentinel-replica-patch.yaml
    target:
      kind: StatefulSet
      name: redis-sentinel
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: secretserver
  - path: certificate-patch.yaml
    target:
      kind: Certificate
      name: secretserver-tls
  - path: enable-insecure-defaults.yaml
    target:
      kind: ConfigMap
      name: secretserver-app-env

configurations:
  - kustomize-config.yaml
