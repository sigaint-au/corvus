apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — single AZ-tolerant replica counts, self-signed TLS.
# Apply with:
#
#   kubectl apply -k deploy/overlays/staging
#
# Bootstrap-time Secrets are NOT managed by this overlay. Run
# `scripts/bootstrap-secrets.sh corvus-staging` once before
# applying (see deploy/README.md → "Secrets bootstrap").

namespace: corvus-staging

resources:
  - ../../base

# Pin images so staging does not float on `:latest` from the base.
# Bump newTag for rollouts, same procedure as prod.
images:
  - name: quay.io/sigaint/corvus
    newName: quay.io/sigaint/corvus
    newTag: "latest"   # floating tag: roll with `kubectl rollout restart`
  - name: postgrest/postgrest
    newName: postgrest/postgrest
    newTag: v12.2.3
  - name: bitnami/redis
    newName: bitnami/redis
    newTag: 7.2.4
  - name: bitnami/redis-exporter
    newName: bitnami/redis-exporter
    newTag: 1.58.0
  - name: bitnami/kubectl
    newName: bitnami/kubectl
    newTag: 1.30.4

# Replicas + HPA tuned for cost, not HA. Each patch entry targets exactly
# one resource by kind+name.
patches:
  - path: app-replicas-patch.yaml
    target:
      kind: Deployment
      name: corvus-app
  - path: postgrest-replicas-patch.yaml
    target:
      kind: Deployment
      name: corvus-postgrest
  - path: app-hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: corvus-app
  - path: postgrest-hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: corvus-postgrest
  - path: postgres-instances-patch.yaml
    target:
      kind: Cluster
      name: corvus-postgres
  - path: redis-replica-patch.yaml
    target:
      kind: StatefulSet
      name: redis
  - path: redis-sentinel-replica-patch.yaml
    target:
      kind: StatefulSet
      name: redis-sentinel
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: corvus
  - path: certificate-patch.yaml
    target:
      kind: Certificate
      name: corvus-tls

configurations:
  - kustomize-config.yaml
