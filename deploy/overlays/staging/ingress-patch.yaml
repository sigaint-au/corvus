apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corvus
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "corvus.staging.internal"
spec:
  tls:
    - hosts:
        - corvus.staging.internal
      secretName: corvus-tls
  rules:
    - host: corvus.staging.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corvus-app
                port:
                  name: http
