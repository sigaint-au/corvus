apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretserver-app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secretserver-redis-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master:6379/0
